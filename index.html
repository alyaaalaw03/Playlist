<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    
    <!-- PWA Manifest Bağlantısı -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7c5c43">

    <!-- Uygulama İkonları -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%237c5c43%22/><text y=%22.9em%22 font-size=%2280%22>🌿</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%237c5c43%22/><text y=%22.9em%22 font-size=%2280%22>🌿</text></svg>">

    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fdfbf7;
            --border-color: #e2d7c5;
            --text-main: #4a3e3d;
            --text-title: #7c5c43;
            --text-sub: #a08c7d;
            --btn-bg: #e8dfd1;
            --btn-active: #7c5c43;
            --inner-bg: #f7f2e9;
        }

        body.gece-modu {
            --bg-color: #1e1b18;
            --card-bg: #2a2421;
            --border-color: #423732;
            --text-main: #e6ded8;
            --text-title: #d4a373;
            --text-sub: #a08c7d;
            --btn-bg: #3d332e;
            --btn-active: #d4a373;
            --inner-bg: #231e1b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: 0.3s;
        }

        .muzik-kutu {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .ust-ara-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        .tema-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        h1 {
            font-size: 32px;
            color: var(--text-title);
            margin-bottom: 2px;
        }

        .alt-baslik {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        /* Dönen Plak Görseli */
        .plak-kapsayici {
            width: 110px;
            height: 110px;
            margin: 10px auto;
        }

        .plak {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #111 30%, #333 31%, #111 60%, #222 61%, #000 100%);
            border: 4px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: don 4s linear infinite;
            animation-play-state: paused;
        }

        .plak.donuyor {
            animation-play-state: running;
        }

        .plak-orta {
            width: 35px;
            height: 35px;
            background: var(--text-title);
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
        }

        @keyframes don {
            100% { transform: rotate(360deg); }
        }

        input[type="file"] { display: none; }

        .dosya-sec-btn {
            background: var(--text-title);
            color: #fff;
            padding: 9px 15px;
            border-radius: 16px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .su-anki-sarki {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-title);
            margin: 10px 0 5px 0;
            min-height: 25px;
            word-break: break-word;
        }

        .ilerleme-alani {
            margin: 10px 0;
        }

        .sure-bilgi {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 3px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--text-title);
            cursor: pointer;
        }

        .kontrol-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }

        button.btn {
            background: var(--btn-bg);
            color: var(--text-main);
            border: none;
            padding: 9px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button.btn.aktif {
            background: var(--btn-active);
            color: white;
        }

        .playlist-alani {
            margin-top: 15px;
            text-align: left;
            background: var(--inner-bg);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .playlist-baslik {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-title);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sarki-listesi {
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
        }

        .sarki-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            font-size: 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
        }

        .sarki-item.caliyor {
            background: var(--btn-bg);
            font-weight: bold;
        }

        .sarki-bilgi {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 10px;
        }

        .sarki-sil-btn {
            background: #d98282;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
        }

        .site-footer {
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
        }
    </style>
</head>
<body>

    <div class="muzik-kutu">
        <div class="ust-ara-bar">
            <button class="tema-btn" id="temaBtn">🌙</button>
        </div>

        <h1>🌿 Playlist</h1>
        <div class="alt-baslik">Kendi Çalma Listeni Oluştur</div>

        <div class="plak-kapsayici">
            <div class="plak" id="plakGorsel">
                <div class="plak-orta">🎵</div>
            </div>
        </div>
        
        <div>
            <label for="muzikDosya" class="dosya-sec-btn">➕ Şarkı Ekle</label>
            <input type="file" id="muzikDosya" multiple accept="audio/*">
        </div>
        
        <div class="su-anki-sarki" id="sarkiad">Henüz müzik seçilmedi</div>

        <div class="ilerleme-alani">
            <input type="range" id="ilerlemeCubugu" value="0" min="0" step="1">
            <div class="sure-bilgi">
                <span id="gecenSure">0:00</span>
                <span id="toplamSure">0:00</span>
            </div>
        </div>

        <audio id="sesOynatici"></audio>

        <div class="kontrol-panel">
            <button class="btn" id="oncekiBtn">⏮️</button>
            <button class="btn" id="playBtn">▶️</button>
            <button class="btn" id="pauseBtn">⏸️</button>
            <button class="btn" id="sonrakiBtn">⏭️</button>
        </div>

        <div class="kontrol-panel">
            <button class="btn" id="mixBtn">🔀 Mix: Kapalı</button>
            <button class="btn" id="sessizBtn">🔊 Ses Açık</button>
        </div>

        <div class="playlist-alani">
            <div class="playlist-baslik">
                <span>📜 Çalma Listesi</span>
                <button class="sarki-sil-btn" id="temizleBtn">🗑️ Temizle</button>
            </div>
            
            <ul class="sarki-listesi" id="listeKutusu">
                <li style="font-size: 12px; color: var(--text-sub); text-align: center; padding: 10px;">Lütfen müzik ekleyin...</li>
            </ul>
        </div>

        <div class="site-footer">
            <span>© @Alya Aalaw</span>
            <span>v1.3.2</span>
        </div>
    </div>

    <script>
        const dosyaGirdisi = document.getElementById('muzikDosya');
        const sesOynatici = document.getElementById('sesOynatici');
        const sarkiAdMetni = document.getElementById('sarkiad');
        const listeKutusu = document.getElementById('listeKutusu');
        const mixBtn = document.getElementById('mixBtn');
        const sessizBtn = document.getElementById('sessizBtn');
        const plakGorsel = document.getElementById('plakGorsel');
        const ilerlemeCubugu = document.getElementById('ilerlemeCubugu');
        const gecenSureMetni = document.getElementById('gecenSure');
        const toplamSureMetni = document.getElementById('toplamSure');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const sonrakiBtn = document.getElementById('sonrakiBtn');
        const oncekiBtn = document.getElementById('oncekiBtn');
        const temizleBtn = document.getElementById('temizleBtn');
        const temaBtn = document.getElementById('temaBtn');

        let playlist = [];
        let mevcutIndex = 0;
        let mixModu = false;

        dosyaGirdisi.addEventListener('change', function(e) {
            const yeniDosyalar = Array.from(e.target.files);
            
            yeniDosyalar.forEach(dosya => {
                playlist.push({
                    name: dosya.name,
                    url: URL.createObjectURL(dosya)
                });
            });

            if (playlist.length > 0) {
                listeyiCiz();
                if (!sesOynatici.src) {
                    sarkiCal(0);
                }
            }
        });

        function listeyiCiz() {
            listeKutusu.innerHTML = "";
            if (playlist.length === 0) {
                listeKutusu.innerHTML = '<li style="font-size: 12px; color: var(--text-sub); text-align: center; padding: 10px;">Lütfen müzik ekleyin...</li>';
                sarkiAdMetni.innerText = "Henüz müzik seçilmedi";
                return;
            }
            playlist.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'sarki-item' + (index === mevcutIndex ? ' caliyor' : '');
                
                const bilgiDiv = document.createElement('div');
                bilgiDiv.className = 'sarki-bilgi';
                bilgiDiv.innerText = (index + 1) + ". 🎵 " + item.name;
                bilgiDiv.onclick = () => sarkiCal(index);
                li.appendChild(bilgiDiv);

                const silBtn = document.createElement('button');
                silBtn.className = 'sarki-sil-btn';
                silBtn.innerText = "❌";
                silBtn.onclick = (e) => {
                    e.stopPropagation();
                    sarkiSil(index);
                };
                li.appendChild(silBtn);

                listeKutusu.appendChild(li);
            });
        }

        function sarkiCal(index) {
            if (playlist.length === 0) return;
            mevcutIndex = index;
            const item = playlist[index];
            
            sesOynatici.src = item.url;
            sarkiAdMetni.innerText = item.name;
            listeyiCiz();
            
            sesOynatici.play().then(() => {
                plakGorsel.classList.add('donuyor');
            }).catch(e => {
                console.log("Oynatma engellendi: ", e);
            });
        }

        playBtn.addEventListener('click', () => {
            if (sesOynatici.src) {
                sesOynatici.play();
                plakGorsel.classList.add('donuyor');
            }
        });

        pauseBtn.addEventListener('click', () => {
            sesOynatici.pause();
            plakGorsel.classList.remove('donuyor');
        });

        sonrakiBtn.addEventListener('click', sonrakiSarki);
        oncekiBtn.addEventListener('click', oncekiSarki);

        function sonrakiSarki() {
            if (playlist.length === 0) return;
            
            if (mixModu && playlist.length > 1) {
                let yeniIndex;
                do {
                    yeniIndex = Math.floor(Math.random() * playlist.length);
                } while (yeniIndex === mevcutIndex);
                mevcutIndex = yeniIndex;
            } else {
                mevcutIndex = (mevcutIndex + 1) % playlist.length;
            }
            sarkiCal(mevcutIndex);
        }

        function oncekiSarki() {
            if (playlist.length === 0) return;
            mevcutIndex = (mevcutIndex - 1 + playlist.length) % playlist.length;
            sarkiCal(mevcutIndex);
        }

        sesOynatici.addEventListener('ended', sonrakiSarki);

        mixBtn.addEventListener('click', () => {
            mixModu = !mixModu;
            mixBtn.innerText = mixModu ? "🔀 Mix: Açık" : "🔀 Mix: Kapalı";
            mixBtn.classList.toggle("aktif", mixModu);
        });

        sessizBtn.addEventListener('click', () => {
            sesOynatici.muted = !sesOynatici.muted;
            sessizBtn.innerText = sesOynatici.muted ? "🔇 Sessiz" : "🔊 Ses Açık";
        });

        temaBtn.addEventListener('click', () => {
            document.body.classList.toggle('gece-modu');
        });

        function sarkiSil(index) {
            playlist.splice(index, 1);
            if (playlist.length === 0) {
                sesOynatici.pause();
                sesOynatici.src = "";
                sarkiAdMetni.innerText = "Henüz müzik seçilmedi";
                plakGorsel.classList.remove('donuyor');
            } else if (index === mevcutIndex) {
                sarkiCal(0);
            } else if (index < mevcutIndex) {
                mevcutIndex--;
            }
            listeyiCiz();
        }

        temizleBtn.addEventListener('click', () => {
            playlist = [];
            mevcutIndex = 0;
            sesOynatici.pause();
            sesOynatici.src = "";
            sarkiAdMetni.innerText = "Henüz müzik seçilmedi";
            plakGorsel.classList.remove('donuyor');
            listeyiCiz();
        });

        sesOynatici.addEventListener('timeupdate', () => {
            if (sesOynatici.duration) {
                ilerlemeCubugu.max = Math.floor(sesOynatici.duration);
                ilerlemeCubugu.value = Math.floor(sesOynatici.currentTime);
                gecenSureMetni.innerText = zamanFormatla(sesOynatici.currentTime);
                toplamSureMetni.innerText = zamanFormatla(sesOynatici.duration);
            }
        });

        ilerlemeCubugu.addEventListener('input', (e) => {
            sesOynatici.currentTime = e.target.value;
        });

        function zamanFormatla(saniye) {
            const dk = Math.floor(saniye / 60);
            const sn = Math.floor(saniye % 60);
            return dk + ":" + (sn < 10 ? "0" : "") + sn;
        }
    </script>
</body>
</html>
